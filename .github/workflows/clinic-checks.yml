name: Clinic ERP checks
on:
  push:
    branches: [main, feat/clinic-erp-hardening]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate scripts and required handlers
        run: node scripts/validate.js
